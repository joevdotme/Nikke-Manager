name: catalog-update

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source:
        description: Which source to scrape
        required: true
        type: choice
        options:
          - game
          - prydwen
          - enikk

permissions:
  contents: read

# Game, Prydwen, and enikk all rewrite the same knowledge files.
concurrency:
  group: catalog-data
  cancel-in-progress: false
  queue: max

jobs:
  update:
    if: github.repository == 'joevdotme/Nikke-Manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The read-only GITHUB_TOKEN would override CATALOG_GITHUB_TOKEN on push.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild catalog
        env:
          # Optional. A launcher version document. A launcher-only bump does not scrape.
          # Without it, the game job scrapes when the public catalog fingerprint changes.
          NIKKE_LAUNCHER_VERSION_URL: ${{ vars.NIKKE_LAUNCHER_VERSION_URL }}
        run: node scripts/rebuild-catalog.js --source "${{ inputs.source }}" --write --changelog "$RUNNER_TEMP/changelog.md"
      - name: Open data pull request
        env:
          CATALOG_GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN }}
        run: bash scripts/open-data-pr.sh "${{ inputs.source }}" "$RUNNER_TEMP/changelog.md"
