name: catalog-validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog-validate:
    if: github.repository == 'joevdotme/Nikke-Manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Breaking-change check
        run: node scripts/validate-catalog.js --base "origin/${{ github.base_ref }}"
      - name: Import merge gate
        run: node scripts/verify-import-merge.js
      - name: Weapon gate
        run: |
          # A removed weapon line is an edit. Added roster rows and boss rewrites do not remove one.
          if git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- knowledge/nikke-database.js | grep -E '^-.*weapon:' >/dev/null; then
            node scripts/verify-weapons.js
          else
            echo "No weapon field changes; weapon gate skipped"
          fi
