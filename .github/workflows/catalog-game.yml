name: catalog-game

on:
  schedule:
    # About every 6 hours. A launcher-only bump does not scrape.
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    if: github.repository == 'joevdotme/Nikke-Manager'
    uses: ./.github/workflows/catalog-update.yml
    secrets: inherit
    with:
      source: game
