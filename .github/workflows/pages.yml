name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'joevdotme/Nikke-Manager'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Bump VERSION
        env:
          CATALOG_GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/bump-version.js --write --push
      - name: Stamp the deploy artifact
        run: node scripts/stamp-deploy.js dist
      - name: Set the Sign In flag for this Pages host
        run: node scripts/write-features.js dist/js/features.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
